name: uikit
description: Alter LMS UI Kit (assets, l10n, theme, widget).
version: 0.1.0+1
publish_to: none

environment:
  sdk: ^3.8.0
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.1.0
  gap: ^3.0.1
  go_router: ^15.1.2
  google_fonts: ^6.2.1
  utils:
    path: ../../packages/utils

dev_dependencies:
  build_runner: ^2.4.15
  flutter_test:
    sdk: flutter
  flutter_gen_runner: ^5.10.0
  mocktail: ^1.0.4
  very_good_analysis: ^8.0.0

flutter_gen:
  output: lib/src/gen/
  assets:
    outputs:
      package_parameter_enabled: true

flutter:
  assets:
    - assets/fonts/
    - assets/icons/
    - assets/images/
